[package]
name = "ampwire"
version = "0.1.0"
edition = "2024"
description = "A terminal player inspired by Winamp 2, implemented from scratch for the terminal"
license = "MIT"
repository = "https://github.com/3zcurdia/ampwire"
homepage = "https://3zcurdia.github.io/ampwire/"
readme = "README.md"
keywords = ["tui", "music", "audio", "jellyfin", "player"]
categories = ["multimedia", "command-line-utilities"]

[dependencies]
cpal = "0.18.2"
lofty = "0.25.4"
ratatui = "0.30.2"
rustfft = "6"
rtrb = "0.4.0"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["mp3", "isomp4", "aac", "alac", "flac", "wav", "pcm"] }
toml = "0.8"
toml_edit = "0.22"
unicode-width = "0.2"
walkdir = "2.5.0"
ureq = "3.5.0"
serde_json = "1.0.154"
smb = { version = "0.12.1", default-features = false, features = ["multi_threaded", "sign", "encrypt"] }

# MPRIS (Linux only): the session bus, media keys and Omarchy's media widget.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
