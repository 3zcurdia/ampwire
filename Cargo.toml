[package]
name = "ampwire"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
lofty = "0.25.4"
ratatui = "0.30.2"
rustfft = "6"
rtrb = "0.4.0"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["mp3", "isomp4", "aac", "alac", "flac", "wav", "pcm"] }
toml = "0.8"
toml_edit = "0.22"
unicode-width = "0.2"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3"
